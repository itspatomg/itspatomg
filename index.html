<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidewater Studio and Design | Coming Soon</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden; 
            background-color: #2c4a5a; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        .hero-image {
            height: 100%; 
            width: 100%;
            
            /* ================================================== */
            /* 👇 CHANGE THE NAME INSIDE THE QUOTES BELOW 👇 */
            /* ================================================== */
            background-image: url('tidewater-bg.jpg');
            
            background-position: center center;
            background-repeat: no-repeat;
            background-size: cover;
            
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            
            background-color: rgba(0, 0, 0, 0.2); 
            background-blend-mode: overlay;
        }

        .placeholder-text {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.6); 
            border-radius: 8px;
            max-width: 90%;
        }

        .placeholder-text h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .placeholder-text p {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .placeholder-text .error-msg {
            color: #ff9999;
            font-size: 0.9rem;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="hero-image">
        <div class="placeholder-text">
            <h1>Tidewater Studio</h1>
            <p>Under Construction</p>
            <p>Please come back soon.</p>
            
            <p class="error-msg">
                ⚠️ Image not found.<br>
                Please check that the file name in the code matches your exact image file name.
            </p>
        </div>
    </div>

</body>
</html>
