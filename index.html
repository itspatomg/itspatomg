<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidewater Studio and Design</title>
    
    <style>
        /* 1. Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Fallback color matches the water/edges of your map image */
            background-color: #2c4a5a; 
            
            /* Centers the image horizontally on the screen */
            display: flex;
            justify-content: center;
            
            /* Allows vertical scrolling on smaller screens */
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 2. The Image Container */
        .hero-image {
            /* --- YOUR IMAGE --- */
            /* Ensure this matches the exact file name in your repository */
            background-image: url('tidewater-bg.jpg');
            
            /* Keep the image at the top center */
            background-position: top center;
            background-repeat: no-repeat;
            
            /* 'contain' ensures the whole image is always visible without cropping */
            background-size: contain;
            
            /* Matches the shape of your image so no weird gaps appear */
            width: 100%;
            aspect-ratio: 16 / 9;
            
            /* Prevents the image from getting pixelated on ultra-wide monitors */
            max-width: 2560px; 
        }
    </style>
</head>
<body>

    <!-- The div where the background image loads -->
    <div class="hero-image" role="img" aria-label="Tidewater Studio and Design map of coastal Virginia"></div>

</body>
</html>
