<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tidewater Studio and Design | Coming Soon</title>
    
    <style>
        /* 1. Basic Reset & Fallback Colors */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Fallback color so you never see a blank white page */
            background-color: #2c4a5a; 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #ffffff;
            
            /* This centers the image horizontally */
            display: flex;
            justify-content: center;
            
            /* Allows the page to scroll vertically if the image is taller than the screen */
            overflow-x: hidden;
            overflow-y: auto;
        }

        /* 2. The Image Container */
        .hero-image {
            /* --- THIS IS WHERE YOU SET YOUR IMAGE --- */
            /* Make sure your image is in the same folder and named exactly this */
            background-image: url('tidewater-bg.jpg');
            
            /* Ensure the image scales proportionally */
            background-position: top center;
            background-repeat: no-repeat;
            background-size: contain;
            
            /* This makes the container match the image's aspect ratio perfectly.
               Your provided image is roughly a 16:9 widescreen ratio (1920x1080). */
            width: 100%;
            aspect-ratio: 16 / 9;
            
            /* Ensures the container doesn't get too small on massive screens */
            max-width: 1920px; 
            
            /* Flexbox to center the placeholder text */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* 3. Visible Placeholder Text (Only shows if image fails or is loading) */
        .placeholder-text {
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.6); /* Dark box so text is readable */
            border-radius: 8px;
            max-width: 90%;
        }

        .placeholder-text h1 {
            font-size: 2rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .placeholder-text p {
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .placeholder-text .error-msg {
            color: #ff9999;
            font-size: 0.9rem;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="hero-image">
        <!-- This text will be hidden behind the image if the image loads properly. -->
        <!-- If the image is missing, you will see this box with instructions. -->
        <div class="placeholder-text">
            <h1>Tidewater Studio</h1>
            <p>Under Construction</p>
            <p>Please come back soon.</p>
            
            <p class="error-msg">
                ⚠️ Image not found.<br>
                Please upload a file named <strong>tidewater-bg.jpg</strong> to the same folder as this HTML file.
            </p>
        </div>
    </div>

</body>
</html>
